name: Deploy Next.js to VPS Production

on:
  push:
    branches:
      - main # Action sẽ chạy khi có code mới push/merge vào nhánh main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Xóa khoảng trắng và deploy qua SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Di chuyển vào thư mục chứa code trên VPS
            cd /var/www/ocop-frontend

            # Kéo code mới nhất về
            git pull origin main

            # Tạo file .env từ GitHub Secrets
            echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" > .env
            echo "NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL }}" >> .env
            echo "NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}" >> .env
            echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}" >> .env
            echo "NEXT_PUBLIC_GOOGLE_REDIRECT_URI=${{ secrets.NEXT_PUBLIC_GOOGLE_REDIRECT_URI }}" >> .env

            # Cài đặt thư viện mới (nếu có)
            npm ci

            # Build lại app Next.js
            npm run build

            # Restart lại PM2 để apply code mới (Zero-downtime)
            pm2 reload ocop-web
